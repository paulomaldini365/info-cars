<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makinat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/">Kryefaqja</a>
        <a href="/about">Rreth Meje</a>
    </nav>

    <div class="content">
        <h1>Lista e Makinave</h1>

        {% for car in cars %}
            <div style="border: 1px solid #ddd; padding: 20px; margin: 20px auto; max-width: 500px; border-radius: 10px; background: white; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <img src="{{ car.image }}" alt="{{ car.brand }}" style="width: 100%; border-radius: 8px;">
                <h2 style="color: #2c3e50; margin-top: 15px;">{{ car.brand }} {{ car.model }} ({{ car.year }})</h2>
                <p><strong>Motori:</strong> {{ car.engine }}</p>
                <p><strong>Fuqia:</strong> {{ car.power }}</p>
                <p><strong>Konsumi (100 km):</strong> {{ car.consumption_100 }}</p>
                <p><strong>Konsumi (1000 km):</strong> {{ car.consumption_1000 }}</p>
                <p><strong>Çmimi:</strong> {{ car.price }}</p>
            </div>
        {% endfor %}
    </div>

</body>
</html>
